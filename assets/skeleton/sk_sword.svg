<?xml version="1.0" encoding="UTF-8"?>
<!-- Костяной меч: клинок смотрит ВВЕРХ, рукоять внизу.
     Пивот (кисть): (3, 22) — низ текстуры по центру. -->
<svg xmlns="http://www.w3.org/2000/svg" width="6" height="23" viewBox="0 0 6 23">
  <!-- Клинок: контур -->
  <path d="M3 0 C3.8 2.4 4.2 5 4.2 8 L4.2 15.4 L1.8 15.4 L1.8 8 C1.8 5 2.2 2.4 3 0 Z" fill="#3a3226"/>
  <!-- Клинок: кость -->
  <path d="M3 1 C3.6 3.2 3.7 5.4 3.7 8 L3.7 15.2 L2.3 15.2 L2.3 8 C2.3 5.4 2.4 3.2 3 1 Z" fill="#ded4b8"/>
  <!-- Лезвийная грань (блик) -->
  <path d="M3 1.4 C3.4 3.4 3.4 5.6 3.4 8 L3.4 15 L3.1 15 L3.1 8 C3.1 5.6 3.2 3.4 3 1.4 Z" fill="#f2ead2"/>
  <!-- Трещины кости -->
  <path d="M2.6 5 L3.2 6.2 M3.4 9 L2.7 10.4" stroke="#8b7d5e" stroke-width="0.25"/>
  <!-- Гарда: обломок позвонка -->
  <path d="M0.8 15.2 L5.2 15.2 L5.2 17 L0.8 17 Z" fill="#3a3226"/>
  <rect x="1" y="15.4" width="4" height="1.4" fill="#8f6f3f"/>
  <path d="M1.4 15.7 L4.6 15.7 M1.4 16.5 L4.6 16.5" stroke="#5e4826" stroke-width="0.3"/>
  <!-- Рукоять: обмотка кожей -->
  <path d="M2.2 17 L3.8 17 L3.8 21.6 L2.2 21.6 Z" fill="#3a3226"/>
  <rect x="2.35" y="17.1" width="1.3" height="4.4" fill="#6b4f2a"/>
  <path d="M2.35 17.9 L3.65 18.4 M2.35 19.1 L3.65 19.6 M2.35 20.3 L3.65 20.8" stroke="#4a3620" stroke-width="0.35"/>
  <!-- Налобалансник: головка кости -->
  <circle cx="3" cy="21.9" r="1" fill="#c3b795"/>
</svg>
