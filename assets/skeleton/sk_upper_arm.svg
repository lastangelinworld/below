<?xml version="1.0" encoding="UTF-8"?>
<!-- Плечо (длина 9, толщина 3). Сустав (плечо) — ВВЕРХУ текстуры,
     в сцене спрайт смещается вниз на половину длины. -->
<svg xmlns="http://www.w3.org/2000/svg" width="3" height="9" viewBox="0 0 3 9">
  <!-- Контур -->
  <path d="M1.5 0 C0.7 0 0.3 0.6 0.4 1.4 L0.7 7 C0.8 8 1.1 8.6 1.5 8.6 C1.9 8.6 2.2 8 2.3 7 L2.6 1.4 C2.7 0.6 2.3 0 1.5 0 Z" fill="#3a3226"/>
  <!-- Кость -->
  <path d="M1.5 0.6 C1.1 0.6 0.9 1 1 1.5 L1.2 6.9 C1.3 7.6 1.4 8 1.5 8 C1.6 8 1.7 7.6 1.8 6.9 L2 1.5 C2.1 1 1.9 0.6 1.5 0.6 Z" fill="#ded4b8"/>
  <!-- Головка плеча -->
  <circle cx="1.5" cy="1.2" r="1.1" fill="#efe7cd"/>
  <circle cx="1.2" cy="0.9" r="0.4" fill="#f7f1de"/>
  <!-- Мыщелок (локоть) -->
  <circle cx="1.5" cy="7.5" r="0.85" fill="#efe7cd"/>
  <!-- Тень заднего края -->
  <path d="M1.9 2 L2.1 6.9 C2.1 7.5 2 7.8 1.85 7.9 L1.9 2 Z" fill="#a89a78"/>
</svg>