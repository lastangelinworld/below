<?xml version="1.0" encoding="UTF-8"?>
<!-- Оббитый деревянный щит мечника (держит задняя рука).
     Размер 10x13. Пивот (центр) — середина текстуры. -->
<svg xmlns="http://www.w3.org/2000/svg" width="10" height="13" viewBox="0 0 10 13">
  <!-- Контур -->
  <path d="M0.6 0.6 L9.4 0.6 L9.4 8 L5 12.4 L0.6 8 Z" fill="#2e2313"/>
  <!-- Доски -->
  <path d="M1.2 1.2 L8.8 1.2 L8.8 7.7 L5 11.4 L1.2 7.7 Z" fill="#6e4d26"/>
  <path d="M3.6 1.2 L4 1.2 L4 10.1 M6 1.2 L6.4 1.2 L6.4 10.1" stroke="#4d351a" stroke-width="0.35"/>
  <!-- Металлическая окантовка -->
  <path d="M0.6 0.6 L9.4 0.6 L9.4 1.6 L0.6 1.6 Z" fill="#8f939c"/>
  <path d="M0.6 1.6 L1.6 1.6 L1.6 7.9 L0.6 7.3 Z" fill="#767a83"/>
  <path d="M8.4 1.6 L9.4 1.6 L9.4 7.3 L8.4 7.9 Z" fill="#767a83"/>
  <!-- Умбон: кость -->
  <circle cx="5" cy="5.2" r="2.1" fill="#3a3226"/>
  <circle cx="5" cy="5.2" r="1.7" fill="#ded4b8"/>
  <circle cx="4.5" cy="4.7" r="0.6" fill="#f2ead2"/>
  <!-- Заклёпки -->
  <circle cx="2.2" cy="2.4" r="0.5" fill="#8f939c"/>
  <circle cx="7.8" cy="2.4" r="0.5" fill="#8f939c"/>
  <circle cx="2.2" cy="6.2" r="0.5" fill="#8f939c"/>
  <circle cx="7.8" cy="6.2" r="0.5" fill="#8f939c"/>
</svg>
