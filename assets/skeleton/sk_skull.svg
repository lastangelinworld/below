<?xml version="1.0" encoding="UTF-8"?>
<!-- Череп скелета, 3/4 (как head.png игрока).
     Размер 12x13 = размер в мире (scale 1).
     Пивот (шея): (6, 13) — нижняя середина. -->
<svg xmlns="http://www.w3.org/2000/svg" width="12" height="13" viewBox="0 0 12 13">
  <!-- Контур -->
  <path d="M6 0 C2.6 0 0.6 2 0.6 4.8 C0.6 6.8 1.6 8.2 2.8 8.8 L2.8 10.4 L9.2 10.4 L9.5 8.6 C10.8 7.8 11.6 6.4 11.6 4.6 C11.6 1.9 9.4 0 6 0 Z" fill="#3a3226"/>
  <!-- Кость -->
  <path d="M6 1 C3.2 1 1.7 2.6 1.7 4.7 C1.7 6.3 2.5 7.4 3.5 7.9 L3.6 9.5 L8.5 9.5 L8.8 7.8 C9.9 7.1 10.5 5.9 10.5 4.5 C10.5 2.4 8.8 1 6 1 Z" fill="#ded4b8"/>
  <!-- Тень скулы -->
  <ellipse cx="5" cy="6.8" rx="2.4" ry="1.2" fill="#c3b795"/>
  <!-- Глазницы -->
  <ellipse cx="4" cy="4.6" rx="1.5" ry="1.7" fill="#17140f"/>
  <ellipse cx="8" cy="4.4" rx="1.3" ry="1.5" fill="#17140f"/>
  <!-- Огоньки в глазницах -->
  <circle cx="4.3" cy="4.1" r="0.5" fill="#f2ead2"/>
  <circle cx="8.3" cy="3.9" r="0.4" fill="#f2ead2"/>
  <!-- Нос -->
  <path d="M6 6 L7 6.8 L5.7 7.3 Z" fill="#17140f"/>
  <!-- Верхняя челюсть с зубами -->
  <rect x="3.4" y="8.1" width="5.4" height="1.5" fill="#efe7cd"/>
  <rect x="4.5" y="8.2" width="0.5" height="1.3" fill="#3a3226"/>
  <rect x="6.1" y="8.2" width="0.5" height="1.3" fill="#3a3226"/>
  <!-- Нижняя челюсть: отдельно, читается сустав -->
  <path d="M3.2 9.9 L8.9 9.9 L8.2 11.4 L4.4 11.6 Z" fill="#cfc4a2"/>
  <path d="M4 10.3 L8.2 10.3" stroke="#3a3226" stroke-width="0.4"/>
  <!-- Шея: позвонки к пивоту -->
  <rect x="4.6" y="11.4" width="2.8" height="1.6" rx="0.7" fill="#b3a583"/>
</svg>