<?xml version="1.0" encoding="UTF-8"?>
<!-- Грудная клетка с позвоночником, 3/4. Идёт ВВЕРХ от пивота.
     Размер 13x12 = размер в мире (scale 1).
     Пивот (поясница): (6.5, 12) — нижняя середина. -->
<svg xmlns="http://www.w3.org/2000/svg" width="13" height="12" viewBox="0 0 13 12">
  <!-- Контур -->
  <path d="M6.5 0 C4 0 2.2 1.4 1.6 3.4 C1 5.6 1.1 8 1.9 9.6 L11.1 9.6 C11.9 8 12 5.6 11.4 3.4 C10.8 1.4 9 0 6.5 0 Z" fill="#3a3226"/>
  <!-- Кость -->
  <path d="M6.5 1 C4.5 1 3.2 2.1 2.7 3.8 C2.2 5.6 2.3 7.6 2.9 8.7 L10.1 8.7 C10.7 7.6 10.8 5.6 10.3 3.8 C9.8 2.1 8.5 1 6.5 1 Z" fill="#d6ccb0"/>
  <!-- Грудина -->
  <rect x="5.9" y="1.5" width="1.4" height="4.4" fill="#efe7cd"/>
  <!-- Рёбра: дуги -->
  <path d="M3 2.6 C4.6 1.7 8.4 1.7 10 2.7 L9.8 3.5 C8.2 2.6 4.7 2.6 3.2 3.4 Z" fill="#efe7cd"/>
  <path d="M2.7 4.3 C4.5 3.3 8.5 3.3 10.3 4.4 L10.1 5.2 C8.4 4.2 4.6 4.2 2.9 5.1 Z" fill="#e6ddc2"/>
  <path d="M2.8 6 C4.5 5 8.5 5 10.2 6.1 L10 6.9 C8.4 5.9 4.6 5.9 3 6.8 Z" fill="#ded4b8"/>
  <!-- Тени между рёбрами -->
  <path d="M3.3 3.5 C4.8 2.7 8.2 2.7 9.7 3.6 L9.6 4.2 C8.1 3.4 4.8 3.4 3.4 4.2 Z" fill="#7d7157" opacity="0.5"/>
  <path d="M3.1 5.2 C4.7 4.3 8.3 4.3 9.9 5.3 L9.8 5.9 C8.3 5 4.7 5 3.2 5.9 Z" fill="#7d7157" opacity="0.45"/>
  <!-- Плечевые головки -->
  <circle cx="2.1" cy="1.9" r="1.2" fill="#efe7cd"/>
  <circle cx="10.9" cy="1.9" r="1.2" fill="#efe7cd"/>
  <!-- Поясничные позвонки к пивоту -->
  <rect x="5.4" y="9.1" width="2.2" height="1.5" rx="0.6" fill="#c3b795"/>
  <rect x="5.5" y="10.5" width="2" height="1.5" rx="0.6" fill="#b3a583"/>
</svg>