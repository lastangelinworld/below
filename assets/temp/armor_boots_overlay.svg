       Размер = BackFoot.png / FrontFoot.png (141x207), накладывается 1-в-1.
       Замените содержимое своей текстурой, сохранив viewBox. -->
  <g>
    <!-- Основа сапога -->
    <path d="M34 12 Q48 -6 93 -6 Q114 6 108 24 L108 194 Q81 212 34 194 Z" fill="#9c8a68"/>
    <!-- Подъём -->
