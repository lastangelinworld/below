    <path d="M50 50 Q54 100 48 166" stroke="#7f6f52" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M74 48 Q72 100 76 166" stroke="#7f6f52" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M98 50 Q94 100 100 166" stroke="#7f6f52" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Ремень-ремешок -->
    <rect x="36" y="130" width="72" height="16" rx="8" fill="#6b5a3f"/>
    <rect x="62" y="128" width="18" height="20" rx="4" fill="#4d4029"/>
    <!-- Шнуровка -->
    <path d="M54 60 L84 70" stroke="#5d5039" stroke-width="4" stroke-linecap="round"/>
    <path d="M52 80 L86 90" stroke="#5d5039" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 100 L88 110" stroke="#5d5039" stroke-width="4" stroke-linecap="round"/>
