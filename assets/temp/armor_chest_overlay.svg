<svg xmlns="http://www.w3.org/2000/svg" width="282" height="415" viewBox="0 0 282 415">
  <!-- Тканевый нагрудник: безрукавная рубаха с V-вырезом и подолом.
       Размер = torso.png (282x415), накладывается поверх торса 1-в-1.
       Замените содержимое своей текстурой, сохранив viewBox. -->
  <g>
    <!-- Основа рубахи -->
    <path d="M74 34 Q141 12 208 34 L226 250 Q141 282 56 250 Z" fill="#9c8a68"/>
    <!-- V-образный вырез горловины -->
    <path d="M104 30 Q141 20 178 30 L141 96 Z" fill="#7a6a4d"/>
    <!-- Плечевые вставки -->
    <path d="M74 34 Q96 60 92 96" stroke="#6f5f46" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M208 34 Q186 60 190 96" stroke="#6f5f46" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Вертикальные складки ткани -->
    <path d="M120 110 Q124 180 118 246" stroke="#7f6f52" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M162 110 Q158 180 164 246" stroke="#7f6f52" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Подол -->
    <path d="M56 250 Q141 282 226 250 L222 276 Q141 308 60 276 Z" fill="#84734f"/>
    <path d="M56 250 Q141 282 226 250" stroke="#5d5039" stroke-width="6" fill="none"/>
    <!-- Пояс -->
    <rect x="60" y="196" width="162" height="26" rx="9" fill="#6b5a3f"/>
    <rect x="128" y="194" width="26" height="30" rx="6" fill="#4d4029"/>
  </g>
</svg>
